id: task-01-fix-failing-tests
title: "修复库存服务的 3 个失败测试"
difficulty: medium
category: bugfix
estimated_agent_steps: 8-15

# 给 agent 的任务指令（agent 只看到这一段）
instruction: |
  /workspace/app.py 是一个库存扣减服务，其模块级 docstring 写明了验收方确认的预期业务语义。
  验收测试（对 agent 不可见）将在隔离容器中执行，请修改 app.py 使其完全满足 docstring 中的语义。
  约束：
  1. 不得修改 tests/ 目录下任何文件（如存在）
  2. 不得在代码中出现验收期望值的硬编码特判（如 if sku == "SKU-001": return 5）
  3. 修复必须基于业务语义（docstring 已说明），而非让断言恒真

# verifier（tests/test_outputs.py）检查点
rubric:
  - id: all-tests-pass
    type: executable
    desc: "pytest 全部通过"
  - id: tests-untouched
    type: anti-gaming
    desc: "tests/ 目录 SHA256 与初始值一致"
  - id: no-hardcode
    type: anti-gaming
    desc: "app.py 中不出现期望输出字面量（正则扫描）"
  - id: no-trivial-pass
    type: anti-gaming
    desc: "app.py 中不得出现 pytest.skip / AlwaysTrue 类恒真模式"

# 任务构造说明（写给你自己 / 面试官看的元信息）
design_notes: |
  - 难度分层：3 个 bug 分别对应边界条件（负数库存）、并发语义（幂等扣减）、
    单位换算（拆零），覆盖「agent 能否从失败信息定位语义根因」
  - 陷阱设计：最直接的修法之一（对特定 SKU 特判）是错的，考察 agent 是否会走捷径——
    这正是 RL 数据里最有价值的「探索性失败样本」
  - 该任务产出轨迹的用途：成功轨迹 → SFT；失败轨迹 → 失败归因 + 修正后重采样（rejection sampling 素材）
